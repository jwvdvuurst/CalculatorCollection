services:
  calculator-collector:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    profiles:
      - graph
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1" >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  neo4j-data: