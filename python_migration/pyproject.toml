[project]
name = "calculator-collection-python-migration"
version = "0.1.0"
description = "Python migration blueprint for the Calculator Collection application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "neo4j>=5.26,<6",
    "argon2-cffi>=23.1,<26",
    "PyJWT>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["python_migration", "python_migration.calculator_collection", "python_migration.calculator_collection.adapters", "python_migration.calculator_collection.adapters.graph", "python_migration.calculator_collection.api", "python_migration.calculator_collection.lambdas", "python_migration.calculator_collection.repositories", "python_migration.calculator_collection.services", "python_migration.tests"]
